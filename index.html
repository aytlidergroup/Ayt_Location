<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت لوکیشن مغازه‌ها</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #f0f4f8;
    color: #1e293b;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg,#1e3a8a,#2563eb);
    color: white;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; flex: 1; }
  .btn {
    background: #2563eb; color: white; border: none;
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
    font-family: inherit; font-size: 13px;
  }
  .btn:hover { opacity: .9; }
  .btn.green { background: #16a34a; }
  .btn.red { background: #dc2626; }
  .btn.gray { background: #64748b; }
  .btn.gold { background: #d97706; }

  #searchBar {
    display: flex; gap: 8px; padding: 10px 16px; background: white;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    z-index: 1000;
    flex-wrap: wrap;
  }
  #searchBar input {
    flex: 1; min-width: 180px;
    padding: 10px 12px; border: 1px solid #cbd5e1;
    border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  #searchBar select {
    padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit;
  }

  #main { flex: 1; display: flex; overflow: hidden; position: relative; }

  #sidePanel {
    width: 360px; background: white; overflow-y: auto;
    border-left: 1px solid #e2e8f0;
  }
  .store-card {
    padding: 12px 14px; border-bottom: 1px solid #e2e8f0;
    cursor: pointer; transition: background .15s;
  }
  .store-card:hover { background: #f1f5f9; }
  .store-card.active { background: #dbeafe; border-right: 3px solid #2563eb; }
  .store-card .num {
    display: inline-block; background: #1e3a8a; color: white;
    font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 6px;
  }
  .store-card h3 { font-size: 14px; margin-bottom: 4px; }
  .store-card p { font-size: 12px; color: #64748b; margin-top: 3px; }
  .store-card .tags { margin-top: 6px; }
  .tag {
    display: inline-block; font-size: 10px; padding: 2px 7px;
    border-radius: 8px; margin-left: 4px;
  }
  .tag.has { background: #dcfce7; color: #166534; }
  .tag.no { background: #fee2e2; color: #991b1b; }

  #map { flex: 1; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center; z-index: 2000;
    padding: 12px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: white; border-radius: 12px; width: 100%; max-width: 480px;
    max-height: 92vh; overflow-y: auto;
    padding: 20px;
  }
  .modal h2 { font-size: 16px; margin-bottom: 14px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: #475569; margin-bottom: 4px; }
  .field input {
    width: 100%; padding: 9px 11px; border: 1px solid #cbd5e1;
    border-radius: 8px; font-family: inherit; font-size: 13px;
  }
  .coords-row { display: flex; gap: 8px; }
  .coords-row .field { flex: 1; }
  .modal-actions {
    display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap;
  }
  .modal-actions .btn { flex: 1; }

  .hint {
    font-size: 11px; color: #64748b; margin-top: 4px; line-height: 1.5;
  }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: white; padding: 10px 20px;
    border-radius: 8px; font-size: 13px; opacity: 0;
    transition: opacity .3s; pointer-events: none; z-index: 3000;
  }
  #toast.show { opacity: 1; }

  #loading {
    position: fixed; inset: 0; background: rgba(255,255,255,.8);
    display: none; align-items: center; justify-content: center;
    z-index: 4000; font-size: 16px;
  }
  #loading.show { display: flex; }

  @media (max-width: 720px) {
    #sidePanel {
      position: absolute; inset: 0; width: 100%; z-index: 500;
      transform: translateX(100%); transition: transform .3s;
    }
    #sidePanel.open { transform: translateX(0); }
    #map { width: 100%; }
    .mobile-close { display: block !important; }
  }
  .mobile-close { display: none; }
</style>
</head>
<body>

<header>
  <h1>🏪 مدیریت لوکیشن مغازه‌ها</h1>
  <button class="btn" onclick="togglePanel()">📋 لیست</button>
  <button class="btn green" onclick="openAddModal()">➕ مغازه جدید</button>
</header>

<div id="searchBar">
  <input type="text" id="searchInput" placeholder="🔍 جستجو بر اساس نام / شماره / آدرس...">
  <select id="filterSelect">
    <option value="all">همه</option>
    <option value="has">دارای لوکیشن</option>
    <option value="no">بدون لوکیشن</option>
  </select>
</div>

<div id="main">
  <div id="sidePanel">
    <div style="padding:10px 14px; background:#f8fafc; border-bottom:1px solid #e2e8f0; font-size:12px; color:#475569;">
      <span id="countLabel">در حال بارگذاری...</span>
      <button class="btn gray mobile-close" style="float:left; padding:4px 10px; font-size:11px;" onclick="togglePanel()">بستن ✕</button>
    </div>
    <div id="storeList"></div>
  </div>
  <div id="map"></div>
</div>

<!-- Add Modal -->
<div class="modal-backdrop" id="addModal">
  <div class="modal">
    <h2>➕ افزودن مغازه جدید</h2>
    <div class="field"><label>شماره مغازه (A)</label><input id="add_number"></div>
    <div class="field"><label>اسم مغازه (B)</label><input id="add_name"></div>
    <div class="field"><label>آدرس (C)</label><input id="add_address"></div>
    <div class="field">
      <label>آدرس گوگل مپ / ویز (D)</label>
      <input id="add_mapAddress">
      <div class="hint">می‌توانید لینک گوگل مپ پیست کنید یا با دکمه زیر از موقعیت فعلی استفاده کنید</div>
    </div>
    <div class="coords-row">
      <div class="field"><label>Longitude (E)</label><input id="add_lng"></div>
      <div class="field"><label>Latitude (F)</label><input id="add_lat"></div>
    </div>
    <div class="modal-actions">
      <button class="btn gold" onclick="useCurrentLocation('add')">📍 موقعیت فعلی</button>
      <button class="btn gray" onclick="closeModal('addModal')">انصراف</button>
      <button class="btn green" onclick="submitAdd()">💾 ذخیره</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <h2>✏️ ویرایش مغازه</h2>
    <input type="hidden" id="edit_rowIndex">
    <div class="field"><label>شماره مغازه (A)</label><input id="edit_number"></div>
    <div class="field"><label>اسم مغازه (B)</label><input id="edit_name"></div>
    <div class="field"><label>آدرس (C)</label><input id="edit_address"></div>
    <div class="field">
      <label>آدرس گوگل مپ / ویز (D)</label>
      <input id="edit_mapAddress">
    </div>
    <div class="coords-row">
      <div class="field"><label>Longitude (E)</label><input id="edit_lng"></div>
      <div class="field"><label>Latitude (F)</label><input id="edit_lat"></div>
    </div>
    <div class="modal-actions">
      <button class="btn gold" onclick="useCurrentLocation('edit')">📍 موقعیت فعلی</button>
      <button class="btn gray" onclick="closeModal('editModal')">انصراف</button>
      <button class="btn" onclick="submitEdit()">💾 ذخیره</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="loading">⏳ لطفاً صبر کنید...</div>

<script>
/* ============================================================
   ⚠️ آدرس Apps Script خود را اینجا قرار دهید
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbzSYk_dQJdVlwHGUdZeqi1-eo4Dnx-76WKZt0zyj0LN8u5QmwgwHRoOgCLD8pFeMIo4/exec";

/* ==================== State ==================== */
let stores = [];
let map, markersLayer;
let currentMarker = null;

/* ==================== Init Map ==================== */
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([35.6892, 51.3890], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

/* ==================== API Helpers ==================== */
function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  return fetch(API_URL + "?" + qs, { method: 'GET', redirect: 'follow' })
    .then(r => r.json());
}
function apiPost(params) {
  const qs = new URLSearchParams(params).toString();
  return fetch(API_URL, {
    method: 'POST',
    body: qs,
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
  }).then(r => r.json());
}

function showLoading(show) {
  document.getElementById('loading').classList.toggle('show', show);
}
function toast(msg, duration = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), duration);
}

/* ==================== Load ==================== */
async function loadStores() {
  showLoading(true);
  try {
    const res = await apiGet({ action: 'getAll' });
    if (res.success) {
      stores = res.data;
      renderList();
      renderMarkers();
    } else {
      toast('خطا: ' + res.message);
    }
  } catch (e) {
    toast('خطا در اتصال: ' + e.message);
  } finally {
    showLoading(false);
  }
}

/* ==================== Render List ==================== */
function renderList() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filter = document.getElementById('filterSelect').value;

  const filtered = stores.filter(s => {
    const text = `${s.number} ${s.name} ${s.address} ${s.mapAddress}`.toLowerCase();
    if (q && !text.includes(q)) return false;
    const hasLoc = s.lat && s.lng && !isNaN(parseFloat(s.lat)) && !isNaN(parseFloat(s.lng));
    if (filter === 'has' && !hasLoc) return false;
    if (filter === 'no' && hasLoc) return false;
    return true;
  });

  document.getElementById('countLabel').textContent =
    `${filtered.length} از ${stores.length} مغازه`;

  const list = document.getElementById('storeList');
  list.innerHTML = '';
  if (!filtered.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8;font-size:13px;">نتیجه‌ای یافت نشد</div>';
    return;
  }

  filtered.forEach(s => {
    const hasLoc = s.lat && s.lng && !isNaN(parseFloat(s.lat)) && !isNaN(parseFloat(s.lng));
    const div = document.createElement('div');
    div.className = 'store-card';
    div.dataset.row = s.rowIndex;
    div.innerHTML = `
      <h3><span class="num">${s.number || '—'}</span>${s.name || 'بدون نام'}</h3>
      <p>📍 ${s.address || 'بدون آدرس'}</p>
      ${s.mapAddress ? `<p style="font-size:11px;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">🔗 ${s.mapAddress}</p>` : ''}
      <div class="tags">
        <span class="tag ${hasLoc ? 'has' : 'no'}">${hasLoc ? '✓ لوکیشن دارد' : '✗ بدون لوکیشن'}</span>
      </div>
      <div style="margin-top:8px; display:flex; gap:6px;">
        <button class="btn" style="padding:4px 10px; font-size:11px;" onclick="event.stopPropagation();focusStore(${s.rowIndex})">🗺️ نمایش</button>
        <button class="btn gray" style="padding:4px 10px; font-size:11px;" onclick="event.stopPropagation();openEditModal(${s.rowIndex})">✏️ ویرایش</button>
      </div>
    `;
    div.addEventListener('click', () => focusStore(s.rowIndex));
    list.appendChild(div);
  });
}

/* ==================== Render Markers ==================== */
function renderMarkers() {
  markersLayer.clearLayers();
  stores.forEach(s => {
    const lat = parseFloat(s.lat), lng = parseFloat(s.lng);
    if (isNaN(lat) || isNaN(lng)) return;
    const marker = L.marker([lat, lng]).addTo(markersLayer);
    marker.bindPopup(`
      <div style="direction:rtl;font-family:Tahoma;min-width:180px;">
        <b>${s.number ? '#'+s.number+' ' : ''}${s.name || 'بدون نام'}</b><br>
        <small>${s.address || ''}</small><br>
        <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank">🚗 مسیریابی</a>
      </div>
    `);
    marker.on('click', () => {
      document.querySelectorAll('.store-card').forEach(c => c.classList.remove('active'));
      const card = document.querySelector(`.store-card[data-row="${s.rowIndex}"]`);
      if (card) card.classList.add('active');
    });
  });
}

/* ==================== Focus store ==================== */
function focusStore(rowIndex) {
  const s = stores.find(x => x.rowIndex === rowIndex);
  if (!s) return;
  const lat = parseFloat(s.lat), lng = parseFloat(s.lng);
  document.querySelectorAll('.store-card').forEach(c => c.classList.remove('active'));
  const card = document.querySelector(`.store-card[data-row="${rowIndex}"]`);
  if (card) card.classList.add('active');

  if (!isNaN(lat) && !isNaN(lng)) {
    map.setView([lat, lng], 16);
  } else {
    toast('این مغازه لوکیشن ثبت‌شده ندارد. از دکمه ویرایش استفاده کنید.');
  }
  if (window.innerWidth <= 720) document.getElementById('sidePanel').classList.remove('open');
}

/* ==================== Toggle panel (mobile) ==================== */
function togglePanel() {
  document.getElementById('sidePanel').classList.toggle('open');
}

/* ==================== Modals ==================== */
function openAddModal() {
  ['add_number','add_name','add_address','add_mapAddress','add_lng','add_lat']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('addModal').classList.add('open');
}
function openEditModal(rowIndex) {
  const s = stores.find(x => x.rowIndex === rowIndex);
  if (!s) return;
  document.getElementById('edit_rowIndex').value = rowIndex;
  document.getElementById('edit_number').value = s.number || '';
  document.getElementById('edit_name').value = s.name || '';
  document.getElementById('edit_address').value = s.address || '';
  document.getElementById('edit_mapAddress').value = s.mapAddress || '';
  document.getElementById('edit_lng').value = s.lng || '';
  document.getElementById('edit_lat').value = s.lat || '';
  document.getElementById('editModal').classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

/* ==================== Current location ==================== */
function useCurrentLocation(prefix) {
  if (!navigator.geolocation) {
    toast('GPS پشتیبانی نمی‌شود');
    return;
  }
  toast('در حال دریافت موقعیت...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude.toFixed(7);
      const lng = pos.coords.longitude.toFixed(7);
      document.getElementById(prefix + '_lat').value = lat;
      document.getElementById(prefix + '_lng').value = lng;
      document.getElementById(prefix + '_mapAddress').value =
        `https://www.google.com/maps?q=${lat},${lng}`;
      toast('✅ موقعیت ثبت شد');
    },
    err => toast('خطا: ' + err.message),
    { enableHighAccuracy: true, timeout: 15000 }
  );
}

/* ==================== Submit Add ==================== */
async function submitAdd() {
  const data = {
    number: document.getElementById('add_number').value,
    name: document.getElementById('add_name').value,
    address: document.getElementById('add_address').value,
    mapAddress: document.getElementById('add_mapAddress').value,
    lng: document.getElementById('add_lng').value,
    lat: document.getElementById('add_lat').value
  };
  if (!data.name.trim()) { toast('نام مغازه الزامی است'); return; }
  showLoading(true);
  try {
    const res = await apiPost({ action: 'add', data: JSON.stringify(data) });
    if (res.success) {
      toast('✅ مغازه اضافه شد');
      closeModal('addModal');
      await loadStores();
    } else toast('خطا: ' + res.message);
  } catch (e) { toast('خطا: ' + e.message); }
  finally { showLoading(false); }
}

/* ==================== Submit Edit ==================== */
async function submitEdit() {
  const data = {
    rowIndex: parseInt(document.getElementById('edit_rowIndex').value),
    number: document.getElementById('edit_number').value,
    name: document.getElementById('edit_name').value,
    address: document.getElementById('edit_address').value,
    mapAddress: document.getElementById('edit_mapAddress').value,
    lng: document.getElementById('edit_lng').value,
    lat: document.getElementById('edit_lat').value
  };
  if (!data.name.trim()) { toast('نام مغازه الزامی است'); return; }
  showLoading(true);
  try {
    const res = await apiPost({ action: 'update', data: JSON.stringify(data) });
    if (res.success) {
      toast('✅ ذخیره شد');
      closeModal('editModal');
      await loadStores();
      map.setView([parseFloat(data.lat) || 35.6892, parseFloat(data.lng) || 51.3890], 16);
    } else toast('خطا: ' + res.message);
  } catch (e) { toast('خطا: ' + e.message); }
  finally { showLoading(false); }
}

/* ==================== Search events ==================== */
document.getElementById('searchInput').addEventListener('input', renderList);
document.getElementById('filterSelect').addEventListener('change', renderList);

/* ==================== Start ==================== */
initMap();
loadStores();
</script>
</body>
</html>
